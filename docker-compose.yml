services:
  # 1. Akkudoktor EOS Backend (Isolated, no public ports!)
  eos:
    image: akkudoktor/eos:latest
    container_name: eos-backend
    restart: unless-stopped
    # NOTE: In production, do NOT expose ports 8503/8504 to the host or internet!
    # EOS is only reachable within the internal docker network.
    expose:
      - "8503"
    volumes:
      - eos-data:/eos/data
    environment:
      - EOS_DATA_DIR=/eos/data
    networks:
      - eos-internal

  # 2. Smart Charge UI (Public web app & secure read-only proxy)
  smart-charge-ui:
    build: .
    container_name: eos-smart-charge-ui
    restart: unless-stopped
    ports:
      # Bound to localhost so only Caddy reverse proxy can access it
      - "127.0.0.1:8505:8505"
    environment:
      - SMART_CHARGE_PORT=8505
      - EOS_API_URL=http://eos:8503
      - READ_ONLY_MODE=true  # Protects EOS from public modifications; uses client-side LocalStorage
    networks:
      - eos-internal
    depends_on:
      - eos

volumes:
  eos-data:

networks:
  eos-internal:
    driver: bridge
